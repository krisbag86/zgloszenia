version: "3.8"

services:
  # 1. Full-stack IT Support Web Application Node.js + Express + WS Server
  web-app:
    build: .
    container_name: it_support_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - DB_SSL=false
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 2. Relational Database Instance (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: it_support_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_tickets"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Web-based Database Administration Utility
  pgadmin:
    image: dpage/pgadmin4
    container_name: it_support_pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
